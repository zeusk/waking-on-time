# Publishes the offline single-file deck (dist/waking-up-on-time.html) as the GitHub Pages site, with the PDF
# beside it. Nothing is built here: run `npm run dist` locally, commit dist/ and push.
# Requires Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - dist/waking-up-on-time.html
      - dist/waking-up-on-time.pdf
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/waking-up-on-time.html _site/index.html
          cp dist/waking-up-on-time.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
